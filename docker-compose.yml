version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: bank_infosec_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - infosec_network

  base_service:
    build:
      context: .
      dockerfile: services/base_service/Dockerfile
    container_name: bank_infosec_base_service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=bank_infosec
      - LOCAL_LOG_DIR=/var/log/bank_infosec
      - GCP_PROJECT=dummy-gcp-project
      - GCS_BUCKET=dummy-gcs-bucket
      - PARQUET_LOG_BUFFER_SIZE=5
      - PARQUET_ARCHIVE_INTERVAL_SECONDS=10
    volumes:
      - ./shared:/app/shared
      - ./services/base_service:/app/services/base_service
      - local_parquet_logs:/var/log/bank_infosec
    depends_on:
      - mongodb
    networks:
      - infosec_network

volumes:
  mongo_data:
  local_parquet_logs:

networks:
  infosec_network:
    driver: bridge
